<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Dashboard - OBS Widget</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Roboto', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: transparent;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .widget-wrapper {
            text-align: center;
            background: rgba(15, 23, 42, 0.4); /* Soft semi-transparent backing for readability */
            padding: 30px;
            border-radius: 24px;
            backdrop-filter: blur(4px);
        }

        /* --- New Info Bar Styles --- */
        .info-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            font-size: 16px;
            font-weight: 500;
            color: #E2E8F0;
            margin-bottom: 25px;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.6);
        }

        .info-item {
            background: rgba(0, 0, 0, 0.4);
            padding: 6px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* --- Timer Styles --- */
        .timer-container {
            position: relative;
        }

        .pomo-counter {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #94A3B8;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            text-transform: uppercase;
        }

        .timer {
            font-size: 80px;
            font-weight: 700;
            margin: 12px 0;
            color: #FFFFFF;
            text-shadow: 3px 3px 8px rgba(0, 0, 0, 0.6);
        }

        .session-type {
            font-size: 24px;
            font-weight: 600;
            margin-top: 10px;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #EF4444; /* Default Focus Red */
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.4);
        }

        .session-type.break {
            color: #10B981; /* Break Green */
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            opacity: 0;
            transition: opacity 0.3s ease;
            margin-top: 15px;
        }

        .widget-wrapper:hover .controls {
            opacity: 1;
        }

        .btn {
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
        }

        .btn-start { background: #10B981; color: white; }
        .btn-pause { background: #F59E0B; color: white; }
        .btn-reset { background: #EF4444; color: white; }
        .btn-preset { background: #4B5563; color: white; }
        .btn:hover { transform: translateY(-1px); filter: brightness(1.1); }

        .progress-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            z-index: -1;
        }

        .progress-ring circle {
            fill: transparent;
            stroke-width: 8;
            stroke-linecap: round;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }

        .progress-ring .progress {
            stroke: #EF4444;
            transition: stroke-dashoffset 0.3s ease;
        }

        .break .progress {
            stroke: #10B981;
        }

        .timer-wrapper {
            position: relative;
            display: inline-block;
            margin: 20px 0;
        }
    </style>
</head>
<body>

    <div class="widget-wrapper" id="widgetWrapper">
        <div class="info-bar">
            <div class="info-item" id="liveClock">00:00:00</div>
            <div class="info-item" id="liveDate">Loading Date...</div>
            <div id="weatherDisplay" class="info-item">Cloudy --°C</div>
        </div>

        <div class="timer-container">
            <div class="pomo-counter" id="pomoCounter">POMO 0</div>
            
            <div class="timer-wrapper">
                <svg class="progress-ring">
                    <circle class="progress" cx="150" cy="150" r="140" id="progressCircle"></circle>
                </svg>
                <div class="timer" id="timer">25:00</div>
            </div>
            
            <div class="session-type" id="sessionType">FOCUS</div>
            
            <div class="controls">
                <button class="btn btn-start" id="startBtn">START</button>
                <button class="btn btn-reset" id="resetBtn">RESET</button>
                <hr style="width:100%; border:0; margin:4px 0;">
                <button class="btn btn-preset" id="workPreset">Work (25m)</button>
                <button class="btn btn-preset" id="shortPreset">Short (5m)</button>
                <button class="btn btn-preset" id="longPreset">Long (15m)</button>
            </div>
        </div>
    </div>

    <script>
        class PomodoroTimer {
            constructor() {
                // Preset Configurations (In Seconds)
                this.presets = { focus: 25 * 60, short: 5 * 60, long: 15 * 60 };
                
                this.currentTime = this.presets.focus;
                this.totalTime = this.presets.focus;
                this.isRunning = false;
                this.pomoCount = 0;
                this.interval = null;
                
                this.initializeElements();
                this.setupEventListeners();
                this.startSystemClock();
                this.fetchWeather();
                this.updateDisplay();
                
                // Refresh weather every 15 minutes
                setInterval(() => this.fetchWeather(), 15 * 60 * 1000);
            }

            initializeElements() {
                this.timerElement = document.getElementById('timer');
                this.sessionTypeElement = document.getElementById('sessionType');
                this.pomoCounterElement = document.getElementById('pomoCounter');
                this.startBtn = document.getElementById('startBtn');
                this.resetBtn = document.getElementById('resetBtn');
                this.progressCircle = document.getElementById('progressCircle');
                this.widgetWrapper = document.getElementById('widgetWrapper');
                
                const circumference = 2 * Math.PI * 140;
                this.progressCircle.style.strokeDasharray = circumference;
                this.progressCircle.style.strokeDashoffset = 0;
            }

            setupEventListeners() {
                this.startBtn.addEventListener('click', () => this.toggleTimer());
                this.resetBtn.addEventListener('click', () => this.reset());
                
                // Dynamic phase changes
                document.getElementById('workPreset').addEventListener('click', () => this.switchPhase('FOCUS', this.presets.focus, false));
                document.getElementById('shortPreset').addEventListener('click', () => this.switchPhase('SHORT BREAK', this.presets.short, true));
                document.getElementById('longPreset').addEventListener('click', () => this.switchPhase('LONG BREAK', this.presets.long, true));
            }

            // Real-Time System Clock and Calendar Function
            startSystemClock() {
                const updateClock = () => {
                    const now = new Date();
                    document.getElementById('liveClock').textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                    document.getElementById('liveDate').textContent = now.toLocaleDateString([], { month: 'short', day: 'numeric' });
                };
                updateClock();
                setInterval(updateClock, 1000);
            }

            // Free API Weather Fetch Logic
            async fetchWeather() {
                // Default coordinates (Set your Latitude & Longitude here)
                const lat = 49.2827; 
                const lon = -123.1207; 
                
                try {
                    const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code`);
                    const data = await response.json();
                    
                    if(data && data.current) {
                        const temp = Math.round(data.current.temperature_2m);
                        const code = data.current.weather_code;
                        
                        // Basic Weather code interpreter mapping
                        let condition = "Clear";
                        if (code > 0 && code <= 3) condition = "Cloudy";
                        else if (code >= 51 && code <= 67) condition = "Rainy";
                        else if (code >= 71 && code <= 77) condition = "Snowy";
                        else if (code >= 80) condition = "Showers";

                        document.getElementById('weatherDisplay').textContent = `${condition} ${temp}°C`;
                    }
                } catch (error) {
                    document.getElementById('weatherDisplay').textContent = "Weather Error";
                }
            }

            switchPhase(label, duration, isBreak) {
                this.pause();
                this.currentTime = duration;
                this.totalTime = duration;
                this.sessionTypeElement.textContent = label;
                
                if (isBreak) {
                    this.sessionTypeElement.className = 'session-type break';
                    this.widgetWrapper.className = 'widget-wrapper break';
                } else {
                    this.sessionTypeElement.className = 'session-type';
                    this.widgetWrapper.className = 'widget-wrapper';
                }
                this.updateDisplay();
            }

            toggleTimer() {
                if (this.isRunning) this.pause();
                else this.start();
            }

            start() {
                if (!this.isRunning) {
                    this.isRunning = true;
                    this.startBtn.textContent = 'PAUSE';
                    this.startBtn.className = 'btn btn-pause';
                    
                    this.interval = setInterval(() => {
                        this.currentTime--;
                        this.updateDisplay();
                        
                        if (this.currentTime <= 0) {
                            clearInterval(this.interval);
                            if(this.sessionTypeElement.textContent === 'FOCUS') this.pomoCount++;
                            this.reset();
                        }
                    }, 1000);
                }
            }

            pause() {
                this.isRunning = false;
                this.startBtn.textContent = 'START';
                this.startBtn.className = 'btn btn-start';
                if (this.interval) {
                    clearInterval(this.interval);
                    this.interval = null;
                }
            }

            reset() {
                this.pause();
                this.currentTime = this.totalTime;
                this.updateDisplay();
            }

            updateDisplay() {
                const minutes = Math.floor(this.currentTime / 60).toString().padStart(2, '0');
                const seconds = (this.currentTime % 60).toString().padStart(2, '0');
                this.timerElement.textContent = `${minutes}:${seconds}`;
                this.pomoCounterElement.textContent = `Pomo ${this.pomoCount}`;
                
                const progress = (this.totalTime - this.currentTime) / this.totalTime;
                const circumference = 2 * Math.PI * 140;
                this.progressCircle.style.strokeDashoffset = circumference - (progress * circumference);
            }
        }

        document.addEventListener('DOMContentLoaded', () => { new PomodoroTimer(); });
    </script>
</body>
</html>
